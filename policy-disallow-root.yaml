apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
spec:
  validationFailureAction: Enforce
  background: false
  rules:
  - name: check-run-as-non-root
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - team-dev-a
          - team-dev-b
          - team-dev-c
    validate:
      message: "Chinh sach an toan: Khong duoc phep chay container voi quyen Root (runAsNonRoot phai la true)!"
      pattern:
        spec:
          securityContext:
            runAsNonRoot: true
