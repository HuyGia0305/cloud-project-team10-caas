apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-c-web
  namespace: team-dev-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app: team-c-web
  template:
    metadata:
      labels:
        app: team-c-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.31.7-alpine3.24-perl
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: team-c-web
  namespace: team-dev-c
spec:
  selector:
    app: team-c-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
