apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-b
  namespace: team-dev-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin-b
  template:
    metadata:
      labels:
        app: httpbin-b
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: httpbin
          image: docker.io/mccutchen/go-httpbin:2.26.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 150m, memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /get
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin-b
  namespace: team-dev-b
spec:
  selector:
    app: httpbin-b
  ports:
    - port: 8080
      targetPort: 8080