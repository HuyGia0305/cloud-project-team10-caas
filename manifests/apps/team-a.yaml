apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-a-api
  namespace: team-dev-a
  labels:
    app: team-a-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: team-a-api
  template:
    metadata:
      labels:
        app: team-a-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/team10/caas-team-a-api:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POSTGRES_HOST
              value: shared-postgres.team-shared.svc.cluster.local
            - name: POSTGRES_DB
              value: caas_team_a
            - name: POSTGRES_USER
              value: team_a
            - name: REDIS_HOST
              value: shared-redis.team-shared.svc.cluster.local
            - name: REDIS_USER
              value: team_a
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: team-a-db-auth
                  key: REDIS_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: team-a-db-auth
                  key: POSTGRES_PASSWORD
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 300m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: team-a-api
  namespace: team-dev-a
  labels:
    app: team-a-api
spec:
  selector:
    app: team-a-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 8081
      targetPort: 8080