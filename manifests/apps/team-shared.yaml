apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-postgres-data
  namespace: team-shared
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-postgres
  namespace: team-shared
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shared-postgres
  template:
    metadata:
      labels:
        app: shared-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: docker.io/library/postgres:16.15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: caas
            - name: POSTGRES_DB
              value: caas
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-auth
                  key: POSTGRES_PASSWORD
            - name: TEAM_A_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-auth
                  key: TEAM_A_PASSWORD
            - name: TEAM_B_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-auth
                  key: TEAM_B_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "caas", "-d", "caas"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d/10-create-team-databases.sh
              subPath: 10-create-team-databases.sh
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shared-postgres-data
        - name: init-scripts
          configMap:
            name: postgres-init
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: shared-postgres
  namespace: team-shared
spec:
  selector:
    app: shared-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-redis
  namespace: team-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shared-redis
  template:
    metadata:
      labels:
        app: shared-redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: docker.io/library/redis:7.4.11-alpine
          command:
            - sh
            - -c
            - |
              umask 077
              printf 'user default off\nuser team_a on >%s ~team-a-* -@all +ping +incr +incrby +get\nuser team_b on >%s ~team-b-* -@all +ping +incr +incrby +get\n' "$TEAM_A_REDIS_PASSWORD" "$TEAM_B_REDIS_PASSWORD" > /tmp/redis-users.acl
              exec redis-server --port 6379 --aclfile /tmp/redis-users.acl --save '' --appendonly no
          ports:
            - containerPort: 6379
          env:
            - name: TEAM_A_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-auth
                  key: TEAM_A_REDIS_PASSWORD
            - name: TEAM_B_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-postgres-auth
                  key: TEAM_B_REDIS_PASSWORD
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - REDISCLI_AUTH="$TEAM_A_REDIS_PASSWORD" redis-cli --user team_a ping
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shared-redis
  namespace: team-shared
spec:
  selector:
    app: shared-redis
  ports:
    - port: 6379
      targetPort: 6379