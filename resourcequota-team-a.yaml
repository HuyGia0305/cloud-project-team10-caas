apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
  namespace: team-dev-a
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "6"
    count/deployments.apps: "6"
    count/services: "8"
    count/configmaps: "10"
    count/persistentvolumeclaims: "2"