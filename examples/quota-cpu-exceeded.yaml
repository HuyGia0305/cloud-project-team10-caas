apiVersion: v1
kind: Pod
metadata:
  name: quota-cpu-exceeded
  namespace: team-dev-a
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  automountServiceAccountToken: false
  containers:
    - name: first
      image: docker.io/library/busybox:1.36.1
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 400m, memory: 128Mi}
        limits: {cpu: 400m, memory: 256Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    - name: second
      image: docker.io/library/busybox:1.36.1
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 400m, memory: 128Mi}
        limits: {cpu: 400m, memory: 256Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
    - name: third
      image: docker.io/library/busybox:1.36.1
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 400m, memory: 128Mi}
        limits: {cpu: 400m, memory: 256Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]