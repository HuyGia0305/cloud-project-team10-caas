apiVersion: v1
kind: Pod
metadata:
  name: limitrange-too-large
  namespace: team-dev-a
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  automountServiceAccountToken: false
  containers:
    - name: test
      image: docker.io/library/busybox:1.36.1
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: 600m, memory: 256Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
