apiVersion: v1
kind: Pod
metadata:
  name: web-a
  namespace: team-dev-a
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: web
      image: python:3.12-alpine
      command: ["python", "-m", "http.server", "8080", "--bind", "0.0.0.0"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client-a
  namespace: team-dev-a
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: client
      image: python:3.12-alpine
      command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client-b
  namespace: team-dev-b
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: client
      image: python:3.12-alpine
      command: ["sleep", "3600"]