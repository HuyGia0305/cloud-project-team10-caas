apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-user-c
  namespace: team-dev-c
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-role-c
  namespace: team-dev-c
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-rolebinding-c
  namespace: team-dev-c
subjects:
  - kind: ServiceAccount
    name: dev-user-c
    namespace: team-dev-c
roleRef:
  kind: Role
  name: dev-role-c
  apiGroup: rbac.authorization.k8s.io
