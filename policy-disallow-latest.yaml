apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: false
  rules:
  - name: require-image-tag
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - team-dev-a
          - team-dev-b
          - team-dev-c
    validate:
      message: "Chinh sach bao mat CaaS: Khong duoc dung tag :latest, bat buoc chi dinh phien ban cu the (vi du: nginx:1.25)!"
      pattern:
        spec:
          containers:
          - image: "!*:latest"
